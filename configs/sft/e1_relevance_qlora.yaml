# E1：ESCI query–商品相关性四分类，单卡 L40S QLoRA。数据由 ecomq.data.prepare_esci 生成，
# 提交时用 DATASET_DIR=$DATA_ROOT/e1_relevance/llamafactory。设计理由见 DEVLOG S7。
# 续训：同一 RUN 重新提交即从最新 checkpoint 继续（transformers 5.x 不要写 overwrite_output_dir）。
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset: esci_rel_train
eval_dataset: esci_rel_val
template: qwen
cutoff_len: 384
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: saves/e1-qlora-r16
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true

per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

per_device_eval_batch_size: 16
eval_strategy: steps
eval_steps: 200
report_to: none
