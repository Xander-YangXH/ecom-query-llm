# 全参数微调，仅用于 NSCC 多卡：作业脚本里必须追加 deepspeed=configs/ds/ds_z3.json。
# CCDS 单卡 L40S 放不下 7B 全参数，请不要在那里提交。学习率比 LoRA 低一个数量级。
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: full

dataset: ecom_query_train
eval_dataset: ecom_query_val
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: saves/qwen7b-full
logging_steps: 10
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false

per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 200
report_to: none
