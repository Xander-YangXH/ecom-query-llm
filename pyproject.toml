[project]
name = "ecomq"
version = "0.1.0"
description = "电商搜索 Query 理解：SFT-LoRA / DPO / GRPO 实验项目"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
synth = ["openai"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
